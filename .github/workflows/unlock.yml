name: Unlock Game

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UnityPy
        run: pip install UnityPy==1.25.4
      - name: Patch build data
        run: python scripts/unlock_game.py
      - name: Commit patched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Build/undead-corridor-v26041701.data.unityweb index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unlock Undead Corridor GMSDK gate"
            git push
          fi
